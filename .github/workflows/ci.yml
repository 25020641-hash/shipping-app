name: Java CI Build All Labs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Test Bai1
      run: mvn clean test
      working-directory: ./Bai1
      continue-on-error: true

    - name: Test Bai2
      run: mvn clean test
      working-directory: ./Bai2
      continue-on-error: true

