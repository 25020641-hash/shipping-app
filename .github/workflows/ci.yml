name: Java CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải mã nguồn từ GitHub về máy chủ ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Chạy lệnh build và kiểm thử Maven cho Bai3
      - name: Build and Test Maven Project
        working-directory: ./Bai3
        run: mvn clean package

      # Bước 4: Lưu file .jar sau khi đóng gói thành công
      - name: Upload Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: shipping-app-jar
          path: Bai3/target/*.jar